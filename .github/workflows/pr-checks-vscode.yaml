name: PR Checks - VS Code Extension

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nsuts-vscode
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          cache-dependency-path: nsuts-vscode

      - name: Cache WDIO dependecies
        uses: actions/cache@v5
        with:
          path: nsuts-vscode/.wdio-vscode-service
          key: ${{ runner.os }}-wdio

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: E2E Tests
        run: xvfb-run -a npm run wdio || echo "e2e failed :-("
        env:
          NSUTS_EMAIL: ${{ secrets.NSUTS_EMAIL }}
          NSUTS_PASSWORD: ${{ secrets.NSUTS_PASSWORD }}